# golangci-lint configuration for termiflow
# Compatible with golangci-lint v2
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
      - unusedwrite
  goimports:
    local-prefixes: github.com/oluoyefeso/termiflow
  misspell:
    locale: US
issues:
  exclude-rules:
    - text: "ST1005"
      linters:
        - staticcheck
  max-issues-per-linter: 50
  max-same-issues: 10
