# golangci-lint configuration for termiflow
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - bodyclose

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
      - unusedwrite  # false positives with encoding/json (fields consumed via reflection)
  goimports:
    local-prefixes: github.com/oluoyefeso/termiflow
  misspell:
    locale: US

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
    - path: _test\.go
      text: "shadow"
    - text: "unused-parameter"
      linters:
        - revive
  max-issues-per-linter: 50
  max-same-issues: 10
