version: '3.8'

services:
  # Backend API — managed mode proxy server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: termiflow-api:latest
    container_name: termiflow-api
    env_file: .env          # reads TERMIFLOW_* vars from .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data    # persists SQLite key database
    restart: unless-stopped

  # CLI — for running one-off commands or scheduled feed refreshes
  cli:
    build: .
    image: termiflow:latest
    container_name: termiflow
    volumes:
      - ./config:/home/termiflow/.config/termiflow
      - ./data:/home/termiflow/.local/share/termiflow
      - ./cache:/home/termiflow/.cache/termiflow
    environment:
      - TERMIFLOW_ANTHROPIC_API_KEY=${TERMIFLOW_ANTHROPIC_API_KEY}
      - TERMIFLOW_TAVILY_API_KEY=${TERMIFLOW_TAVILY_API_KEY}
    profiles:
      - cli
